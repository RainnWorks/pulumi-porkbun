[project]
  name = "rainnworks_porkbun"
  description = "A Pulumi provider for Porkbun: DNS records and domain nameservers."
  dependencies = ["packaging>=24.0", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["porkbun", "dns", "domain", "nameservers", "category/network", "kind/native"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.1.2"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://github.com/RainnWorks/pulumi-porkbun"
    Repository = "https://github.com/RainnWorks/pulumi-porkbun"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      rainnworks_porkbun = ["py.typed", "pulumi-plugin.json"]
