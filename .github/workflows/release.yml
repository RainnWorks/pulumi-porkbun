name: release

# Push a tag vX.Y.Z on a commit whose .version, schema and SDKs are already at
# X.Y.Z (see CONTRIBUTING.md, "Releasing"). This publishes:
#   - the provider plugin, to this repo's GitHub Releases (Pulumi downloads it from there)
#   - @rainnworks/porkbun to npm
#   - rainnworks-porkbun to PyPI (trusted publishing, no token)
#   - RainnWorks.Porkbun to NuGet
#   - the Go SDK, as the tag sdk/vX.Y.Z
# Each registry is skipped until it is switched on with a repository variable:
# NPM_ENABLED, PYPI_ENABLED, NUGET_ENABLED. Variables are read when the run
# starts, so set them before pushing the tag.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  PULUMI_VERSION: 3.272.0
  PULUMI_BACKEND_URL: file://${{ github.workspace }}/.pulumi
  PULUMI_SKIP_UPDATE_CHECK: "1"

jobs:
  verify:
    name: tag matches .version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat .version)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match .version ($file). Run 'make release VERSION=$tag' first."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install Pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
      - name: Generated code matches the tag
        run: make codegen VERSION="${{ steps.v.outputs.version }}" && make check_clean
      - run: make test

  provider:
    name: provider plugin
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.verify.outputs.version }}" '
            $0 ~ "^## " && found { exit }
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: go sdk tag
    needs: [verify, provider]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The Go SDK is the module in sdk/, versioned by the tag sdk/vX.Y.Z, which is
      # pushed with vX.Y.Z (see CONTRIBUTING.md). The workflow's own token can't
      # push it: GitHub refuses a tag from GITHUB_TOKEN on a commit whose workflow
      # files differ from main's. So this job only checks it.
      - name: sdk/${{ github.ref_name }} is on this commit
        run: |
          sha=$(git rev-parse -q --verify "refs/tags/sdk/${GITHUB_REF_NAME}^{commit}" || true)
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::push the tag sdk/${GITHUB_REF_NAME} on $GITHUB_SHA alongside ${GITHUB_REF_NAME}"
            exit 1
          fi

  nodejs:
    name: npm
    needs: [verify, provider]
    # npm trusted publishing (OIDC): no token. The package's trusted publisher is
    # this repo and release.yml. Turn on with repository variable NPM_ENABLED=true.
    if: vars.NPM_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Built with Bun; published with npm, which does trusted publishing and provenance.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5+)
        run: npm install -g npm@latest
      - name: Build
        run: |
          cd sdk/nodejs && bun install && bun run --bun build
          cp ../../README.md ../../LICENSE package.json bin/
      - name: Publish
        run: cd sdk/nodejs/bin && npm publish --access public --provenance

  python:
    name: pypi
    needs: [verify, provider]
    # Turn on once PyPI trusted publishing is set up: repository variable PYPI_ENABLED=true.
    if: vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: cd sdk/python && python -m pip install -q build && python -m build . --outdir ../../dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  dotnet:
    name: nuget
    needs: [verify, provider]
    # NuGet trusted publishing: no stored key. Needs a trusted publishing policy
    # on nuget.org for this repo and release.yml, and repository variables
    # NUGET_USER (the nuget.org account) and NUGET_ENABLED=true.
    if: vars.NUGET_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build the package
        # The generated project packs itself on build (GeneratePackageOnBuild);
        # a separate `dotnet pack` then fails with NU5026. Collect what the build made.
        run: |
          cd sdk/dotnet
          echo "${{ needs.verify.outputs.version }}" > version.txt
          dotnet build -c Release
          mkdir -p ../../nuget && find . -name '*.nupkg' -exec cp {} ../../nuget/ \;
          ls -la ../../nuget
      - name: Log in to NuGet (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push nuget/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
