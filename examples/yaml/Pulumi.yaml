name: porkbun-example-yaml
runtime: yaml
description: Manage DNS records on a Porkbun domain.

config:
  domain:
    type: string

resources:
  apex:
    type: porkbun:DnsRecord
    properties:
      domain: ${domain}
      type: A
      content: 203.0.113.10
  www:
    type: porkbun:DnsRecord
    properties:
      domain: ${domain}
      name: www
      type: CNAME
      content: ${domain}
  verification:
    type: porkbun:DnsRecord
    properties:
      domain: ${domain}
      name: _example-verification
      type: TXT
      content: pulumi-porkbun-example
      notes: Created by the pulumi-porkbun example

variables:
  nameservers:
    fn::invoke:
      function: porkbun:getNameservers
      arguments:
        domain: ${domain}

outputs:
  names:
    - ${apex.fqdn}
    - ${www.fqdn}
    - ${verification.fqdn}
  delegatedTo: ${nameservers.nameservers}
